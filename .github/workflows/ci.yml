name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Check design tokens are up to date
        run: |
          npm run tokens
          git diff --exit-code src/modules/common/styles/tokens.css
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test --if-present
      - run: npm run build
