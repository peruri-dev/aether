# DITUNDA: menunggu persetujuan PAT (RELEASE_PLEASE_TOKEN).
# Setelah PAT disimpan sebagai secret, kembalikan trigger ke push ke main.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
